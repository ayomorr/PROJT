<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollGuard</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #e8edf2;
        background-color: #0f141a;
        background-image:
          radial-gradient(20rem 14rem at 0% 0%, rgba(124, 107, 240, 0.22), transparent 62%),
          radial-gradient(18rem 14rem at 100% 100%, rgba(167, 139, 250, 0.14), transparent 60%),
          linear-gradient(180deg, #12161f 0%, #0f141a 100%);
        font-size: 14px;
        padding: 12px;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .logo {
        width: 30px; height: 30px; border-radius: 9px;
        background: linear-gradient(135deg, #8379e8, #5b47d9);
        color: #fff; font-weight: 800; display: grid; place-items: center;
        box-shadow: 0 2px 8px rgba(124, 107, 240, 0.4);
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { font-size: 12px; color: #a3aebb; }
      .card {
        background: #222b37; border: 1px solid rgba(232, 237, 242, 0.1); border-radius: 12px;
        padding: 12px; margin-bottom: 10px;
      }
      .label { font-size: 11px; color: #6e7a87; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
      .big { font-size: 22px; font-weight: 800; }
      .row { display: flex; justify-content: space-between; align-items: center; }
      .muted { color: #a3aebb; }
      button {
        font-family: inherit; font-size: 13px; font-weight: 800; border: 0;
        border-radius: 10px; padding: 9px 12px; cursor: pointer;
      }
      .primary { background: #6d5ae6; color: #fff; width: 100%; }
      .ghost { background: #1c1f3d; color: #e8edf2; width: 100%; margin-top: 6px; }
      .link { color: #aca5f6; text-decoration: none; font-weight: 700; }
      details { margin-top: 6px; }
      summary { font-size: 12px; color: #6e7a87; cursor: pointer; }
      input {
        width: 100%; font: inherit; padding: 7px 9px; margin-top: 4px;
        border: 1px solid rgba(232, 237, 242, 0.2); border-radius: 8px; background: #222b37;
        color: #e8edf2;
      }
      .tag {
        display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
        border-radius: 999px; background: #262b54; color: #c0bbfa;
      }
      .tag.warn { background: #402f18; color: #f2c879; }
      .tag.off { background: #232c39; color: #a3aebb; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">S</div>
      <div>
        <h1>ScrollGuard</h1>
        <div class="sub">Scroll less. Live more.</div>
      </div>
    </header>

    <div class="card" id="statusCard">
      <div class="label">Current session</div>
      <div id="sessionLine" class="muted" style="margin-top:4px;">Not tracking right now</div>
      <div id="sessionMeta" class="muted" style="margin-top:2px;font-size:12px;"></div>
    </div>

    <div class="card">
      <div class="row">
        <span class="label">Today (browser)</span>
        <span id="todayBadge"></span>
      </div>
      <div id="todayTotals" class="big" style="margin-top:6px;">0m</div>
      <div id="todayDetail" class="muted" style="font-size:12px;margin-top:2px;">No sessions recorded locally yet</div>
    </div>

    <button id="endBtn" class="ghost hidden">I'm done — end session</button>
    <button id="openDash" class="primary">Open dashboard</button>

    <details>
      <summary>Settings</summary>
      <div style="margin-top:6px;">
        <label class="label" for="api">API base URL</label>
        <input id="api" placeholder="http://localhost:4000/api" />
        <label class="label" for="token">Access token (optional)</label>
        <input id="token" placeholder="Paste sg_token for sync" />
        <button id="save" class="primary" style="margin-top:8px;">Save</button>
        <p class="muted" style="font-size:11px;margin:8px 0 0;">
          Without a token, tracking is local-only (last 8 weeks, never sent anywhere).
        </p>
      </div>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
